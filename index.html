<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STENACHI BRAT</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 25px 18px;
      background: #090b13;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 450px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #b56aff;
    }

    .subtitle {
      margin-top: 9px;
      color: #9995aa;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .card {
      background: linear-gradient(145deg, #191629, #11121e);
      border: 1px solid #39304f;
      border-radius: 18px;
      padding: 23px;
      margin-bottom: 17px;
    }

    .section-title {
      color: #bda1ff;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .balance {
      text-align: center;
    }

    .coin {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .amount {
      font-size: 43px;
      font-weight: bold;
      color: #c18aff;
    }

    .description {
      color: #aaa6b8;
      margin-top: 8px;
      font-size: 14px;
    }

    .currency {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 18px;
      border-radius: 20px;
      background: #302345;
      color: #d2a8ff;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      text-align: center;
      padding: 17px 5px;
      background: #201b31;
      border-radius: 13px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #c18aff;
    }

    .stat-label {
      margin-top: 7px;
      font-size: 12px;
      color: #aaa6b8;
    }

    .top-list {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5px;
      border-bottom: 1px solid #302a40;
      color: #ddd8e8;
    }

    .top-list:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: bold;
      font-size: 17px;
    }

    .top-balance {
      color: #bda1ff;
      font-weight: bold;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 17px;
      margin-top: 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #873eea, #b15aff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      color: #777386;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <div class="logo">STENACHI BRAT</div>
      <div class="subtitle">WALL UPGRADER COMMUNITY</div>
    </header>

    <section class="card balance">
      <div class="section-title">💎 WALLCOIN</div>
      <div class="coin">💎</div>
      <div class="amount" id="balance">0</div>
      <div class="description">Sizning balansingiz</div>
      <div class="currency">WC</div>
    </section>

    <section class="card">
      <div class="section-title">📊 STATISTIKA</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="users">0</div>
          <div class="stat-label">Foydalanuvchilar</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="orders">0</div>
          <div class="stat-label">Buyurtmalar</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">🏆 TOP FOYDALANUVCHILAR</div>

      <div class="top-list">
        <span class="rank">🥇 TOP 1</span>
        <span class="top-balance">— WC</span>
      </div>

      <div class="top-list">
        <span class="rank">🥈 TOP 2</span>
        <span class="top-balance">— WC</span>
      </div>

      <div class="top-list">
        <span class="rank">🥉 TOP 3</span>
        <span class="top-balance">— WC</span>
      </div>
    </section>

    <button class="back-button" onclick="backToBot()">
      ↩ BOTGA QAYTISH
    </button>

    <div class="footer">
      STENACHI BRAT © 2026
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function backToBot() {
      const botUrl = "https://t.me/STENACHI_BOT";

      if (window.Telegram && window.Telegram.WebApp) {
        tg.openTelegramLink(botUrl);
      } else {
        window.location.href = botUrl;
      }
    }
  </script>
</body>
</html>
